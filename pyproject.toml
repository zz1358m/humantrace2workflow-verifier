[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ht2wv"
version = "0.1.0"
description = "HumanTrace2Workflow&Verifier: compile personal (workflow, verifier) skills from the access records you already have"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
screen = ["pynput>=1.7", "mss>=9", "watchdog>=4", "pillow>=10"]
video = ["opencv-python-headless>=4.8", "pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
ht2wv = "ht2wv.cli:main"

[tool.setuptools.packages.find]
include = ["ht2wv*"]

[tool.setuptools.package-data]
ht2wv = ["prompts/*.md", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
