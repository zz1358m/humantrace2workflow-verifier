[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ht2w"
version = "0.1.0"
description = "HumanTrace2Workflow: compile personal (workflow, verifier) skills from computer-use traces"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "pillow>=10"]

[project.optional-dependencies]
screen = ["pynput>=1.7", "mss>=9", "watchdog>=4"]
video = ["opencv-python-headless>=4.8"]
dev = ["pytest>=8"]

[project.scripts]
ht2w = "ht2w.cli:main"

[tool.setuptools.packages.find]
include = ["ht2w*"]

[tool.setuptools.package-data]
ht2w = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
