policy:
  check_depth: full
  timing: both
  trust_default: verify
  on_fail: fix_then_recheck
  max_fix_rounds: 2
  evidence_required: [数据来源的文件名]
  escalate_when: [源数据文件缺失或缺少某项指标]
  risk_tolerance: low
items:
  - id: ST1
    claim: 不出现没有数字支撑的评价性、总结性语句
    how: judge
    rubric: >-
      逐句看正文。像“表现不错”“稳步增长”“状态很好”“表现亮眼”这类不带具体数字的评价即不通过。
      通过例：“收入 $51730”。不通过例：“本周各项指标稳步增长”。
    applies_to: [writing]
    weight: 2
    hard: false
    confidence: 0.6
    source: corrected
    evidence: ["2026-01-05:S011", "2026-01-05:S002", "2026-01-05:S007"]
  - id: ST2
    claim: 引用的数据写明来源
    how: judge
    rubric: 产出里有一处明确写出数据取自哪个文件或哪个系统；只写“据统计”不算。
    applies_to: [writing, data]
    weight: 2
    hard: false
    confidence: 0.6
    source: stated
    evidence: ["2026-01-05:S012", "2026-01-05:S002", "2026-01-05:S007"]
