# 一周七天的退款处理：状态跨天延续。由 make_sample.py 生成（记录沿用 refund-ops，并加入跨天规则的痕迹）。
# style 是预填的个人风格，对管线隐藏：S* 是单日内的顺序与汇报，L* 是跨天才会出现的规则。
id: refund-week
persona:
  name: 许晴
  role: 电商售后运营
purpose: |
  我每天要处理一批退款申请，一周七天都要做。每天给你当天的申请表、主管的审批结果、昨天收工时的后台状态和之前的汇报，
  替我把当天该处理的都处理完，结果要和我自己做的一样，然后在 output/REPORT.md 里向我汇报；周日再给我一份周汇总 output/WEEK.md。
  后台里的动作都是真的，退出去的钱和发出去的通知收不回来，所以先后顺序不能乱；前一天留下的事，第二天要接着办。
rubric:
- id: R1
  claim: 产出 journal.jsonl 和 state.json（由后台生成，不是手写的）以及 REPORT.md
- id: R2
  claim: 今天每一单的结果（退多少 / 升级 / 暂不退 / 驳回 / 不动）和我自己处理的一样，包括前几天留下来的单
- id: R3
  claim: 每一单在做任何动作之前都先查询过
- id: R4
  claim: 通知买家是这一单当天的最后一个动作，当天恰好通知一次，模板和结果对得上；今天不该动的单不通知
- id: R5
  claim: 没有被支付系统拒绝的退款；任何订单都没有被退两次，包括前几天已经退过的
- id: R6
  claim: REPORT.md 第一行是一句话结论，里面的退款单数、退款合计、升级单数与后台当天实际一致
- id: R7
  claim: （周日）WEEK.md 第一行是一句话结论，本周退款单数与合计、仍待处理的单数与后台累计一致
  days:
  - 7
style:
- id: S1
  statement: 按申请时间从早到晚处理，不按表格里的行顺序（额度有限，先来的先退）
  day: 1
  probe:
    dir: probes/S1
- id: S2
  statement: 买家自己原因的退货，退款要扣掉运费
  day: 1
  probe:
    dir: probes/S2
- id: S3
  statement: 单笔超过 500 元的不直接退，升级给主管
  day: 1
  probe:
    dir: probes/S3
- id: S4
  statement: 钱退成功之后才通知买家，通知永远是这一单的最后一步
  day: 1
  probe:
    dir: probes/S4
- id: S5
  statement: 已发货但退货还没签收的不退款，通知买家先寄回
  day: 1
  probe:
    dir: probes/S5
- id: S10
  statement: 当日额度不够退整单时，整单升级，不做部分退款
  day: 1
  probe:
    dir: probes/S10
- id: S6
  statement: 汇报第一行就是一句话结论：几条申请、退了几单合计多少、升级几单、暂不退几单
  day: 1
  probe:
    file: REPORT.md
    regex:
    - ^今日[^\n]*\n
    - |
      以下是今天退款申请的处理情况，请查收。
- id: S7
  statement: 每单一行的表格（订单、处理、金额、原因），不写“我先……然后……”的过程叙述
  day: 1
  probe:
    file: REPORT.md
    set: |
      今日处理 7 单：退款 4 单合计 ¥925.00，升级 2 单，暂不退 1 单，驳回 0 单，重复 1 条。

      我先把今天的申请按时间排了序，然后逐个查询处理。接着查询了 W102，超过 ¥500 需主管审批，所以处理结果是升级，金额 ¥520.00。接着查询了 W107，当日额度不足（剩余 ¥75.00），所以处理结果是升级，金额 ¥210.00。接着查询了 W103，未发货，全额，所以处理结果是已退款，金额 ¥259.00。接着查询了 W101，买家原因，扣运费 ¥12.00，所以处理结果是已退款，金额 ¥187.00。接着查询了 W105，质量问题，全额，所以处理结果是已退款，金额 ¥150.00。接着查询了 W106，质量问题，全额，所以处理结果是已退款，金额 ¥329.00。接着查询了 W104，退货未签收，已通知先寄回，所以处理结果是暂不退，金额 ¥0.00。最后还有一条重复申请，我没有重复处理。
- id: S8
  statement: 需要她亲自处理的单（升级的）排在表格最前面，并标上【待你处理】
  day: 1
  probe:
    file: REPORT.md
    set: |
      今日处理 7 单：退款 4 单合计 ¥925.00，升级 2 单，暂不退 1 单，驳回 0 单，重复 1 条。

      | 订单 | 处理 | 金额 | 原因 |
      |---|---|---|---|
      | W103 | 已退款 | ¥259.00 | 未发货，全额 |
      | W101 | 已退款 | ¥187.00 | 买家原因，扣运费 ¥12.00 |
      | W105 | 已退款 | ¥150.00 | 质量问题，全额 |
      | W106 | 已退款 | ¥329.00 | 质量问题，全额 |
      | W104 | 暂不退 | ¥0.00 | 退货未签收，已通知先寄回 |
      | W102 | 升级 | ¥520.00 | 超过 ¥500 需主管审批 |
      | W107 | 升级 | ¥210.00 | 当日额度不足（剩余 ¥75.00） |

      重复申请：W101，未重复处理。
- id: S9
  statement: 金额一律写成 ¥ 加两位小数
  day: 1
  probe:
    file: REPORT.md
    regex:
    - ¥(\d+)\.00
    - \1元
- id: S11
  statement: 汇报里不贴后台日志和命令，她要看的是结果
  day: 1
  probe:
    file: REPORT.md
    append: |2-

      执行记录：
      python input/env.py lookup W103
      python input/env.py refund W103 259.00
      python input/env.py notify W103 refunded
      python input/env.py lookup W102
      python input/env.py escalate W102 超过500需主管审批
      python input/env.py notify W102 escalated
      python input/env.py lookup W101
      python input/env.py refund W101 187.00
      python input/env.py restock W101
      python input/env.py notify W101 refunded
- id: L1
  statement: 前一天因额度不足没退成的单，第二天和新申请排成一队，按最初申请时间先后处理，所以它们排在最前面
  day: 2
  probe:
    dir: probes/L1
- id: L2
  statement: 主管批准的单，批准后的当天就退，不等买家再来催
  day: 2
  probe:
    dir: probes/L2
- id: L3
  statement: 之前通知过“先寄回”的单，买家寄回签收后再申请要正常退，不算重复
  day: 3
  probe:
    dir: probes/L3
- id: L4
  statement: 之前任何一天已经退过款的订单再来申请，一律不重复退
  day: 3
  probe:
    dir: probes/L4
- id: L5
  statement: 主管驳回的单要通知买家（rejected），不退款，也不能放着不管
  day: 4
  probe:
    dir: probes/L5
- id: L6
  statement: 周日的周汇总第一行是一句话结论：本周共退几单合计多少、还有几单待处理；下面每天一行
  day: 7
  probe:
    file: WEEK.md
    regex:
    - ^本周[^\n]*\n
    - |
      以下是本周退款处理情况的汇总，请查收。
week:
  dir: week
  days: 7
