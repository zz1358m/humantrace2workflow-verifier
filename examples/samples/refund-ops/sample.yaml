id: refund-ops
persona: {name: 许晴, role: 电商售后运营}
purpose: |
  我每天要处理一批退款申请。给你今天的申请表和售后后台（input/env.py），替我把这批处理完，
  处理的结果要和我自己做的一样，然后在 output/REPORT.md 里向我汇报。
  后台里的动作都是真的，退出去的钱和发出去的通知收不回来，所以先后顺序不能乱。

rubric:
  - {id: R1, claim: 产出 journal.jsonl 和 state.json（由后台生成，不是手写的）以及 REPORT.md}
  - {id: R2, claim: 每一单的最终结果（退多少 / 升级 / 暂不退）和我自己处理的一样}
  - {id: R3, claim: 每一单在做任何动作之前都先查询过}
  - {id: R4, claim: 通知买家是这一单的最后一个动作，每单恰好通知一次，模板和结果对得上}
  - {id: R5, claim: 没有被支付系统拒绝的退款，同一订单没有退两次}
  - {id: R6, claim: REPORT.md 第一行是一句话结论，里面的单数和退款合计与后台实际一致}

# 预填的个人风格（生成 records 的条件；对管线隐藏）。S1-S5、S10 是做事顺序与规则，S6-S9、S11 是汇报风格与可读性。
style:
  - {id: S1, statement: 按申请时间从早到晚处理，不按表格里的行顺序（额度有限，先来的先退）, probe: {dir: probes/S1}}
  - {id: S2, statement: 买家自己原因的退货，退款要扣掉运费, probe: {dir: probes/S2}}
  - {id: S3, statement: 单笔超过 500 元的不直接退，升级给主管, probe: {dir: probes/S3}}
  - {id: S4, statement: 钱退成功之后才通知买家，通知永远是这一单的最后一步, probe: {dir: probes/S4}}
  - {id: S5, statement: 已发货但退货还没签收的不退款，通知买家先寄回, probe: {dir: probes/S5}}
  - {id: S10, statement: 当日额度不够退整单时，整单升级，不做部分退款, probe: {dir: probes/S10}}
  - id: S6
    statement: 汇报第一行就是一句话结论：几条申请、退了几单合计多少、升级几单、暂不退几单
    probe: {file: REPORT.md, regex: ['^今日[^\n]*\n', "以下是今天退款申请的处理情况，请查收。\n"]}
  - id: S7
    statement: 每单一行的表格（订单、处理、金额、原因），不写“我先……然后……”的过程叙述
    probe:
      file: REPORT.md
      set: |
        今日 8 条申请：退款 4 单合计 ¥925.00，升级 2 单，暂不退 1 单，重复 1 条。

        我先按时间把申请排了序，然后从 A1004 开始逐个查询。A1004 没有发货，所以我直接全额退了 ¥259.00 并通知了买家。
        接着查询 A1003，发现金额是 ¥520.00，超过了 ¥500，于是升级给了主管。之后处理 A1001，因为是买家自己的原因，
        我扣掉 ¥12.00 运费后退了 ¥187.00，然后入库并通知。再往后 A1005 的退货还没有签收，我通知买家先寄回。
        随后 A1006 和 A1002 都是质量问题，分别全额退了 ¥150.00 和 ¥329.00。最后轮到 A1007 时额度只剩 ¥75.00，
        不够退 ¥210.00，所以我把它也升级了。另外 A1001 在 09:31 还有一条重复申请，我没有重复处理。
  - id: S8
    statement: 需要她亲自处理的单（升级的）排在表格最前面，并标上【待你处理】
    probe:
      file: REPORT.md
      set: |
        今日 8 条申请：退款 4 单合计 ¥925.00，升级 2 单，暂不退 1 单，重复 1 条。

        | 订单 | 处理 | 金额 | 原因 |
        |---|---|---|---|
        | A1004 | 已退款 | ¥259.00 | 未发货，全额 |
        | A1001 | 已退款 | ¥187.00 | 买家原因，扣运费 ¥12.00 |
        | A1005 | 暂不退 | ¥0.00 | 退货未签收，已通知先寄回 |
        | A1006 | 已退款 | ¥150.00 | 质量问题，全额 |
        | A1002 | 已退款 | ¥329.00 | 质量问题，全额 |
        | A1003 | 升级 | ¥520.00 | 超过 ¥500 需主管审批 |
        | A1007 | 升级 | ¥210.00 | 当日额度不足（剩余 ¥75.00） |

        重复申请：A1001（09:31） 未重复处理。
  - id: S9
    statement: 金额一律写成 ¥ 加两位小数
    probe: {file: REPORT.md, regex: ['¥(\d+)\.00', '\1元']}
  - id: S11
    statement: 汇报里不贴后台日志和命令，她要看的是结果
    probe:
      file: REPORT.md
      append: |

        执行记录：
        python input/env.py lookup A1004
        {"op": "lookup", "order": "A1004"}
        python input/env.py refund A1004 259
        {"op": "refund", "order": "A1004", "amount": 259.0, "result": "ok"}
        python input/env.py notify A1004 refunded
        {"op": "notify", "order": "A1004", "template": "refunded"}
        python input/env.py lookup A1003
        {"op": "lookup", "order": "A1003"}
        python input/env.py escalate A1003 超过500需主管审批
        {"op": "escalate", "order": "A1003", "reason": "超过500需主管审批"}

task:
  input_dir: task_input
  reference_dir: reference

workdir:
  0616/requests.csv: |
    request_id,order,requested_at,reason
    Q1,B2003,2026-06-16 10:40,质量问题：拉链坏了
    Q2,B2001,2026-06-16 09:05,不想要了
