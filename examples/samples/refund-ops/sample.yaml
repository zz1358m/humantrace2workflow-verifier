  0616/REPORT_v1.md: |
    您好，今天的退款申请我已经全部处理完毕，下面向您汇报一下详细的处理过程。

    首先我查询了 B2003，这是一个质量问题的订单，我为买家退了168元，然后进行了入库和通知。
    然后我查询了 B2001，买家不想要了，退了88元。接着是 B2002，金额比较大，是899元，我升级给了主管。

    python env.py lookup B2003
