    今日 3 条申请：退款 2 单合计 ¥248.00，升级 1 单，暂不退 0 单，重复 0 条。

    | 订单 | 处理 | 金额 | 原因 |
    |---|---|---|---|
    | B2002 | 【待你处理】升级 | ¥899.00 | 超过 ¥500 需主管审批 |
    | B2001 | 已退款 | ¥80.00 | 买家原因，扣运费 ¥8.00 |
    | B2003 | 已退款 | ¥168.00 | 质量问题，全额 |

