id: guest-reply
persona: {name: 周岚, role: 民宿老板}
purpose: |
  我开一家小民宿，每天要回很多客人的微信咨询。给我一条客人的消息和我的店规，
  帮我写好回复，我看一眼就能直接发。回复要把客人问的每件事都答到，价格和规定不能说错。

rubric:
  - {id: R1, claim: 产出恰好一个文件 reply.txt}
  - {id: R2, claim: 客人问的每件事都答到了（这次是：提前入住、带宠物、总价）}
  - {id: R3, claim: 价格按店规算对：用对了节假日还是平日的单价，给出了总价}
  - {id: R4, claim: 不答应店规之外的事（这次是：不能答应 12 点入住）}
  - {id: R5, claim: 回复不超过 200 个字}

style:
  - id: S1
    statement: 开头用“<姓><先生/女士>您好”称呼客人，不用“亲”
    probe: {file: reply.txt, replace: ["王先生您好：", "亲，在的哦～"]}
  - id: S2
    statement: 不用感叹号、表情和“呀、哦、呢”这类语气词
    probe: {file: reply.txt, replace: ["需要的话我现在帮您留房。", "欢迎您来玩呀！！😊"]}
  - id: S3
    statement: 凡是涉及钱和时间都给具体数字，不说“会贵一些”“稍晚一点”
    probe: {file: reply.txt, replace: ["节假日房价520元/晚，两晚共1040元。", "节假日房价会比平时贵一些。"]}
  - id: S4
    statement: 拒绝客人的要求时一定同时给一个替代办法
    probe: {file: reply.txt, replace: ["12:00暂时安排不了，可以先把行李寄存在前台。", "12:00不行。"]}
  - id: S5
    statement: 结尾单独一行署名“周姐”
    probe: {file: reply.txt, remove_line: 周姐}
  - id: S6
    statement: 报价时主动说明取消规定
    probe: {file: reply.txt, replace: ["入住前3天可以免费取消。", ""]}
  - id: S7
    statement: 回复由本人亲自发出，助手只起草
    probe: null

task:
  input:
    message.txt: |
      发信人：王先生
      你好，想订10月3日入住，住两晚。可以中午12点就入住吗？另外我们带一只小狗可以吗？两晚一共多少钱？
    policy.md: |
      # 店规
      - 入住时间 15:00 以后，退房 12:00 以前。
      - 提前入住看当天房态，最早 13:00，加收 50 元。行李可以免费寄存在前台。
      - 宠物：只接待 10 公斤以内的小型犬，清洁费 80 元/次。
      - 房价：平日 380 元/晚；节假日（10月1日至10月7日）520 元/晚。
      - 取消：入住前 3 天及以上免费取消，之后收取首晚房费。
  reference_output:
    reply.txt: |
      王先生您好：
      10月3日入住两晚，节假日房价520元/晚，两晚共1040元。
      提前入住最早13:00，加收50元；12:00暂时安排不了，可以先把行李寄存在前台。
      宠物可以带10公斤以内的小型犬，清洁费80元/次。
      入住前3天可以免费取消。需要的话我现在帮您留房。
      周姐

