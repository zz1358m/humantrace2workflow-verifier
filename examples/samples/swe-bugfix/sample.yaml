id: swe-bugfix
persona: {name: 陈默, role: 后端工程师}
purpose: |
  给我一个 issue 和出问题的模块（带现有测试），把 bug 修掉，交付可以直接提交的改动：
  改好的源码、测试文件、一条 commit message。我会直接拿去提交，所以不要留尾巴。

rubric:
  - {id: R1, claim: 产出恰好三个文件：pricing.py、test_pricing.py、COMMIT_MSG.txt}
  - {id: R2, claim: issue 里描述的两个错误都修好了（会员折扣只算一次；价格不会低于 0）}
  - {id: R3, claim: final_price 的函数签名（参数名、顺序、默认值）没有变}
  - {id: R4, claim: 原有的测试函数一个都没被删改}
  - {id: R5, claim: 'commit message 第一行形如 "fix(pricing): 说明"，不超过 72 个字符；正文里带上 issue 号'}

style:
  - id: S1
    statement: 修 bug 必须同时加一个能复现该 bug 的回归测试
    probe:
      file: test_pricing.py
      set: |
        from pricing import final_price


        def test_no_discount():
            assert final_price(100) == 100


        def test_member_discount_without_coupon():
            assert final_price(200, member=True) == 180
  - id: S2
    statement: 不为了让测试通过去改已有的测试
    probe: {file: test_pricing.py, replace: ["assert final_price(200, member=True) == 180", "assert final_price(200, member=True) == 162"]}
  - id: S3
    statement: 'commit message 用 "type(scope): 说明" 的格式并引用 issue 号'
    probe: {file: COMMIT_MSG.txt, set: "fixed the pricing bug\n"}
  - id: S4
    statement: 只改必要的行，不顺手重排格式、不重命名、不加无关的东西
    probe:
      file: pricing.py
      set: |
        MEMBER_RATE = 0.9


        def _apply_member(amount: float) -> float:
            return amount * MEMBER_RATE


        def final_price(price: float, member: bool = False, coupon: float = 0.0) -> float:
            """Return the price after member discount (10%) and a fixed coupon, never below zero."""
            amount = _apply_member(price) if member else price
            amount = amount - coupon
            return round(max(amount, 0.0), 2)


        def format_price(amount: float) -> str:
            return f"¥{amount:.2f}"
  - id: S5
    statement: 提交的代码里不留调试输出
    probe: {file: pricing.py, replace: ["    price = price - coupon\n", "    price = price - coupon\n    print(\"DEBUG price after coupon\", price)\n"]}
  - id: S6
    statement: 不为一个小修复引入新的依赖
    probe: {file: pricing.py, replace: ["def final_price", "import numpy as np\n\n\ndef final_price"]}
  - id: S7
    statement: 先写出能复现问题的失败测试，再动源码
    probe: null

task:
  input:
    ISSUE.md: |
      # #482 会员叠加优惠券时价格算错

      - `final_price(100, member=True, coupon=10)` 返回 72.9，应为 80.0（会员九折只应该算一次）。
      - `final_price(5, coupon=10)` 返回 -5，价格不应低于 0。
    pricing.py: |
      def final_price(price: float, member: bool = False, coupon: float = 0.0) -> float:
          """Return the price after member discount (10%) and a fixed coupon, never below zero."""
          if member:
              price = price * 0.9
          price = price - coupon
          if member:
              price = price * 0.9
          return round(price, 2)
    test_pricing.py: |
      from pricing import final_price


      def test_no_discount():
          assert final_price(100) == 100


      def test_member_discount_without_coupon():
          assert final_price(200, member=True) == 180
  reference_output:
    pricing.py: |
      def final_price(price: float, member: bool = False, coupon: float = 0.0) -> float:
          """Return the price after member discount (10%) and a fixed coupon, never below zero."""
          if member:
              price = price * 0.9
          price = price - coupon
          return round(max(price, 0.0), 2)
    test_pricing.py: |
      from pricing import final_price


      def test_no_discount():
          assert final_price(100) == 100


      def test_member_discount_without_coupon():
          assert final_price(200, member=True) == 180


      def test_member_discount_applied_once_with_coupon():
          assert final_price(100, member=True, coupon=10) == 80.0


      def test_price_never_below_zero():
          assert final_price(5, coupon=10) == 0
    COMMIT_MSG.txt: |
      fix(pricing): apply member discount once and clamp price at zero

      Refs #482

workdir:
  git-log.txt: |
    a41c9e2 fix(cart): keep quantity when merging duplicate lines (#467)
    7be0d15 fix(auth): reject expired refresh tokens (#455)
    3f2a8c0 feat(orders): export orders as csv (#431)
    c9d1e77 fix(cart): round line totals before summing (#428)
  cart_fix_467.diff: |
    --- a/cart.py
    +++ b/cart.py
    @@ -14,7 +14,7 @@ def merge_lines(lines):
         for line in lines:
             key = line.sku
             if key in merged:
    -            merged[key].qty = line.qty
    +            merged[key].qty += line.qty
             else:
                 merged[key] = line
    --- a/test_cart.py
    +++ b/test_cart.py
    @@ -30,0 +31,5 @@
    +def test_merge_keeps_quantity_of_duplicates():
    +    lines = [Line("A", 1), Line("A", 2)]
    +    assert merge_lines(lines)[0].qty == 3

